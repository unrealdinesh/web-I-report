<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Lab Report 7</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <main id="main-content">
    <div class="display-container">
      <section class="demo-group">
        <h3>1. display: block</h3>
        <div class="block-demo">
          <div class="block-item">Home</div>
          <div class="block-item">About</div>
          <div class="block-item">Services</div>
        </div>
      </section>

      <section class="demo-group">
        <h3>2. display: inline</h3>
        <div class="inline-demo">
          <span class="inline-item">HTML</span>
          <span class="inline-item">CSS</span>
          <span class="inline-item">JavaScript</span>
        </div>
      </section>

      <section class="demo-group">
        <h3>3. display: inline-block</h3>
        <div class="inline-block-demo">
          <div class="inline-block-item">Profile</div>
          <div class="inline-block-item">Gallery</div>
          <div class="inline-block-item">Contact</div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
