<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Lab Report 5 - Pseudo-Elements</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main id="main-content">
      <h2>Pseudo-Elements</h2>

      <div class="demo-box">
        <p class="pseudo-para">
          This is a simple paragraph inside a div. It demonstrates the use of
          pseudo-elements to style content before, after, and within the text.
        </p>

        <div class="form-group">
          <label for="user-input">Enter text: </label>
          <input
            type="text"
            id="user-input"
            placeholder="Type something..."
          />
        </div>

        <p class="selection-text">
          Select some text to see the ::selection effect.
        </p>
      </div>
    </main>
  </body>
</html>
