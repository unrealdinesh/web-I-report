<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Labwork 1</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <h3 id="heading">CSS Box Model Visualization</h3>
    <section id="legend">
      <div class="wrapper">
        <div class="box red"></div>
        <p>Margin</p>
      </div>
      <div class="wrapper">
        <div class="box orange"></div>
        <p>Border</p>
      </div>
      <div class="wrapper">
        <div class="box blue"></div>
        <p>Padding</p>
      </div>
      <div class="wrapper">
        <div class="box green"></div>
        <p>Content</p>
      </div>
    </section>

    <section id="box-model">
      <div class="margin">
        <p class="text-white">Margin</p>
        <div class="border">
          <p class="text-white">Border</p>
          <div class="padding">
            <p class="text-white">Padding</p>
            <div class="content">
              <p class="text-white">Content</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
